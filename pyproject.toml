[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "vr180-convert"
version = "1.0.1"
description = "Simple VR180 image converter"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.15",
  "array-api-extra>=0.11.5",
  "attrs>=23.2",
  "cyclopts>=4",
  "numpy>=2.2.5",
  "numpy-quaternion>=2024,<2025",
  "opencv-python-headless>=4.9",
  "rich>=10",
  "seaborn>=0.13,<1",
  "torch>=2.13",
  "types-array-api>=1.3",
  "typing-extensions>=4",
]
urls."Bug Tracker" = "https://github.com/34j/vr180-convert/issues"
urls.Changelog = "https://github.com/34j/vr180-convert/blob/main/CHANGELOG.md"
urls.documentation = "https://vr180-convert.readthedocs.io"
urls.repository = "https://github.com/34j/vr180-convert"
scripts.v1c = "vr180_convert.cli:app"
scripts.vr180-convert = "vr180_convert.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-ignore = [
  "A002",    # Built-in names are part of the public CLI/API vocabulary.
  "ARG001",  # Callback arguments are required by the framework.
  "ARG002",  # Remapper hooks implement a shared kwargs-based protocol.
  "BLE001",  # Test fixtures intentionally probe backend availability.
  "D101",    # Public classes are documented where their behavior needs explanation.
  "D102",    # Protocol overrides do not need duplicate docstrings.
  "D105",    # Magic methods are self-explanatory in these value objects.
  "D401",    # Existing project prose is intentionally descriptive.
  "D417",    # Existing NumPy-style docs omit repetitive argument descriptions.
  "DOC201",  # Return sections are excessive for short transformation methods.
  "DOC501",  # ValueError messages document these small validation branches.
  "FBT001",  # Boolean CLI options are intentionally positional in callbacks.
  "FBT002",  # Boolean CLI defaults are part of the command interface.
  "FBT003",  # NumPy constructor flags are clearer as positional arguments here.
  "N802",    # Capitalized factory names are established public API.
  "N806",    # Matrix names follow the mathematical notation in the docs.
  "N812",    # F is the conventional torch functional alias.
  "NPY002",  # Tests do not depend on cryptographic-quality randomness.
  "PGH003",  # Third-party typing stubs do not expose the runtime color types.
  "PLC0415", # Backend-specific imports must remain lazy.
  "PLR6104", # In-place array updates could mutate caller-owned coordinate arrays.
  "PLR6301", # Methods are intentionally grouped with their remapper classes.
  "PYI051",  # Literal unions preserve the accepted CLI value documentation.
  "S404",    # Subprocess is used only with a fixed local Python module command.
  "S603",    # The subprocess command has no user-controlled arguments.
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
