[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "vr180-convert"
version = "1.0.0"
description = "Simple VR180 image converter"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.15",
  "array-api-extra>=0.11",
  "attrs>=23.2",
  "cyclopts>=4",
  "numpy>=2.2.5",
  "numpy-quaternion>=2024,<2025",
  "opencv-python-headless>=4.9",
  "rich>=10",
  "seaborn>=0.13,<1",
  "torch>=2.13",
  "types-array-api>=1.3",
  "typing-extensions>=4",
]
urls."Bug Tracker" = "https://github.com/34j/vr180-convert/issues"
urls.Changelog = "https://github.com/34j/vr180-convert/blob/main/CHANGELOG.md"
urls.documentation = "https://vr180-convert.readthedocs.io"
urls.repository = "https://github.com/34j/vr180-convert"
scripts.v1c = "vr180_convert.cli:app"
scripts.vr180-convert = "vr180_convert.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
target-version = "py312"
line-length = 110
unsafe-fixes = true
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in __init__
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
  "D417", # Missing argument descriptions in docstring
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."docs/conf.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
  "S603",
]
lint.isort.known-first-party = [ "vr180_convert", "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
